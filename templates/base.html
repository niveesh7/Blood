<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}HemaScan{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header><a class="brand" href="/">✦ HemaScan</a>{% if session.get('email') %}<nav><a href="/check">Check</a><a href="{{ '/admin' if admin else '/dashboard' }}">{{ 'Admin panel' if admin else 'My history' }}</a><a href="/logout">Sign out</a></nav>{% endif %}</header><main>{% for kind,msg in get_flashed_messages(with_categories=true) %}<div class="notice {{ kind }}">{{ msg }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
